name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_TOKEN: "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      DATABASE_URL: "postgresql://user:pass@localhost:5432/shadowtalk"
      WEBHOOK_SECRET: "ci_shadowtalk_secret_123456789"
      WEBHOOK_BASE_URL: "https://example.invalid"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q app alembic

      - name: Import production application
        run: python -c "import app.main; print(app.main.app.title)"

      - name: Validate Alembic graph
        run: alembic heads
